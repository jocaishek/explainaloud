<!--
  The mark: page grey on an ink disc, the same two colours as the site's
  primary button, so the tab and the page read as one thing.

  Centred on the glyph's measured bounds, stroke included: x 15 to 45 and
  y 13.3 to 54.8, so its middle is (30, 34.05). Centring on (30, 33), as
  this file used to, left the mark sitting low, and the smile's weight on
  the right made it read as off to one side too.

    glyph #f8f9fa on disc #141517  17.9:1
    disc  #141517 on white         18.6:1

  Written without leading dashes on purpose, because a double hyphen is
  illegal inside an XML comment and silently breaks the whole file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#141517" />
  <g transform="translate(32 32) scale(0.82) translate(-30 -34.05)">
    <path
      d="M 19.1 13.9 L 33.9 20.6 Q 38 22.5 33.9 24.4 L 19.1 31.1 Q 15 33 15 28.5 L 15 16.5 Q 15 12 19.1 13.9 Z"
      fill="#f8f9fa"
    />
    <path
      d="M 17.5 39.5 A 18 18 0 0 0 42.5 50.5"
      fill="none"
      stroke="#f8f9fa"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>
