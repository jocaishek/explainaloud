<!--
  The mark: lit blue on a deep navy disc.

  This is what Google shows beside the result when somebody searches the
  product, and what sits in the browser tab, so it is the logo most people see
  most often. It has to be the same logo as the one in the app.

  A gradient version of this disc existed for one branch and was pulled on
  request: flat is the call. What survives from that experiment is the size —
  the glyph steps from 0.78 to 0.84 of the disc, because the 0.78 clearance
  was designed for a mark sharing space with type and a disc has none — and
  one step of brightness on the glyph, #9cc8f2 to #aed4f7, which is where the
  "pop" now comes from.

  The numbers, because a favicon is judged at 16px where a near miss on
  contrast is simply an illegible smudge:

    glyph #aed4f7 on disc #142744  10.1:1
    disc  #142744 on white         14.96:1
    disc  #142744 on the stock     12.99:1

  Both colours stay in the tokens' family: #142744 is panel-deep, #aed4f7 is
  brand-high lifted one stop. Written without leading dashes on purpose,
  because a double hyphen is illegal inside an XML comment and silently
  breaks the whole file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#142744" />
  <g transform="translate(32 32) scale(0.84) translate(-30 -33)">
    <path
      d="M 19.1 13.9 L 33.9 20.6 Q 38 22.5 33.9 24.4 L 19.1 31.1 Q 15 33 15 28.5 L 15 16.5 Q 15 12 19.1 13.9 Z"
      fill="#aed4f7"
    />
    <path
      d="M 17.5 39.5 A 18 18 0 0 0 42.5 50.5"
      fill="none"
      stroke="#aed4f7"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>
